<div class="max-w-4xl mx-auto p-6 md:p-8 bg-white rounded-2xl shadow-sm border border-slate-200">
    <div class="flex items-center gap-3 mb-6">
        <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center shadow-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        </div>
        <div>
            <h2 class="text-xl font-bold text-slate-800">AI Code Assistant</h2>
            <p class="text-xs text-slate-500">Powered by Llama 3.1 & Ollama</p>
        </div>
    </div>

    <!-- Code Context Input -->
    <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Code Context
            (Optional)</label>
        <textarea [(ngModel)]="codeContext"
            placeholder="Paste relevant HTML, TypeScript, or backend code snippet here..." rows="5"
            class="w-full p-3.5 text-sm font-mono bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-y"></textarea>
    </div>

    <!-- Question Input -->
    <div class="mb-5">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Question /
            Prompt</label>
        <textarea [(ngModel)]="question" placeholder="What would you like to ask about this code or feature?" rows="3"
            class="w-full p-3.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-y"></textarea>
    </div>

    <!-- Submit Button -->
    <button (click)="ask()" [disabled]="loading || (!question.trim() && !codeContext.trim())"
        class="inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-medium text-sm rounded-xl hover:from-blue-700 hover:to-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg transition-all duration-200">
        <svg *ngIf="loading" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
        </svg>
        <span>{{ loading ? 'Generating Answer...' : 'Ask Assistant' }}</span>
    </button>

    <!-- Response Area -->
    <div *ngIf="answer || loading" class="mt-8">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                <span>Assistant Response</span>
                <span *ngIf="loading" class="text-xs font-normal text-blue-600 animate-pulse">(Processing with Llama
                    3.1...)</span>
            </h3>

            <button *ngIf="answer && !loading" (click)="copyAnswer()"
                class="px-3 py-1 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                {{ copied ? 'Copied!' : 'Copy Answer' }}
            </button>
        </div>

        <div *ngIf="loading" class="p-6 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
            <div class="h-4 bg-slate-200 rounded w-3/4 animate-pulse"></div>
            <div class="h-4 bg-slate-200 rounded w-5/6 animate-pulse"></div>
            <div class="h-4 bg-slate-200 rounded w-2/3 animate-pulse"></div>
        </div>

        <div *ngIf="answer && !loading"
            class="p-5 bg-slate-900 text-slate-100 border border-slate-800 rounded-xl text-sm font-mono leading-relaxed whitespace-pre-wrap break-words overflow-x-auto shadow-inner">
            {{ answer }}
        </div>
    </div>
</div>
