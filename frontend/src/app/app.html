<!-- Navbar: only shown once logged in -->
<header *ngIf="isLoggedIn" class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-16">

            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3">
                    <div
                        class="w-10 h-10 rounded-xl bg-gradient-to-r from-white-700 to-blue-600 flex items-center justify-center text-white">
                        🏥
                    </div>
                    <h1 class="font-bold text-xl text-slate-800">
                        Hospital Billing
                    </h1>
                </div>

                <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">

                    <div class="max-w-7xl mx-auto px-6">

                        <div class="flex items-center justify-between h-16">
                            <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-700"
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
                                Dashboard
                            </a>

                            <a routerLink="/patients" routerLinkActive="bg-blue-50 text-blue-700"
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
                                Patients
                            </a>

                            <a routerLink="/services" routerLinkActive="bg-blue-50 text-blue-700"
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
                                Services
                            </a>

                            <a routerLink="/bills" routerLinkActive="bg-blue-50 text-blue-700"
                                class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:bg-blue-50 hover:text-blue-600">
                                Bills
                            </a>
                        </div>
                    </div>
                </nav>
            </div>

            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-500">
                    Hi, {{ userName }}
                </span>

                <button (click)="logout()"
                    class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
                    Logout
                </button>
            </div>

        </div>
    </div>
</header>

<!-- Main Content -->
<main class="min-h-[calc(100vh-170px)]">
    <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer *ngIf="isLoggedIn" class="bg-white border-t border-gray-200 mt-10">
    <div class="max-w-7xl mx-auto px-6 py-6">

        <div class="flex justify-between items-center text-sm text-slate-500">

            <div class="text-sm text-gray-600">
                © {{currentYear}} Hospital Billing Management System.
                All rights reserved.
            </div>

            <div class="flex gap-6">

                <a href="#" class="text-gray-500 hover:text-blue-600 transition-colors">
                    Privacy Policy
                </a>

                <a href="#" class="text-gray-500 hover:text-blue-600 transition-colors">
                    Terms of Service
                </a>

                <span class="text-gray-400">
                    Version 1.0.0
                </span>

            </div>

        </div>

    </div>
</footer>
