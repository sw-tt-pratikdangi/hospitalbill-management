<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white p-8 rounded-xl shadow border border-gray-100">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Reset Password</h2>

        <div *ngIf="successMessage"
            class="bg-green-50 border border-green-200 rounded-lg px-4 py-3 text-sm text-green-800">
            {{ successMessage }}
        </div>

        <form *ngIf="!successMessage" #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <input [(ngModel)]="password" name="password" type="password" required minlength="6"
                    #passwordField="ngModel"
                    class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    [class.border-red-400]="passwordField.invalid && passwordField.touched"
                    [class.border-gray-300]="!(passwordField.invalid && passwordField.touched)" />
                <p *ngIf="passwordField.invalid && passwordField.touched" class="text-xs text-red-600 mt-1">
                    Password must be at least 6 characters.
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required
                    class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    [class.border-red-400]="passwordsMismatch" [class.border-gray-300]="!passwordsMismatch" />
                <p *ngIf="passwordsMismatch" class="text-xs text-red-600 mt-1">Passwords do not match.</p>
            </div>

            <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

            <button type="submit" [disabled]="f.invalid || passwordsMismatch || saving"
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm transition-colors">
                {{ saving ? 'Resetting...' : 'Reset Password' }}
            </button>
        </form>
    </div>
</div>
