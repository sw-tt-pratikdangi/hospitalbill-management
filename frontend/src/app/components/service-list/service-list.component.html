<div class="">

    <div class="max-w-6xl mx-auto px-6 py-8">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
            <div>
                <h2 class="text-2xl font-semibold text-gray-800">Services</h2>
                <p class="text-slate-500 mt-1">
                    Manage hospital services and pricing
                </p>
            </div>
            <a routerLink="/services/new"
                class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition-colors">
                + Add Service
            </a>
        </div>

        <!-- Loading State -->
        <div *ngIf="loading" class="flex items-center gap-2 text-gray-500 text-sm py-4">
            <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Loading services...</span>
        </div>

        <div *ngIf="!loading" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- <div class="bg-white p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

                <div class="flex flex-col md:flex-row gap-4">

                    <input type="text" placeholder="Search services..."
                        class="flex-1 px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

                    <select class="px-4 py-3 border border-slate-200 rounded-xl">
                        <option>All Categories</option>
                        <option>Consultation</option>
                        <option>Lab</option>
                    </select>

                </div>

            </div> -->
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-slate-500">
                            Name
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-slate-500">
                            Category
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider text-slate-500">
                            Price
                        </th>
                        <th class="px-6 py-4 text-center text-xs font-bold uppercase tracking-wider text-slate-500">
                            Actions
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr *ngFor="let s of paginatedServices" class="hover:bg-blue-50 transition-colors duration-200">
                        <td class="px-4 py-3 font-medium text-gray-800">{{ s.name }}</td>
                        <td class="px-4 py-3">
                            <span
                                class="inline-block bg-blue-50 text-blue-700 text-xs font-medium px-2.5 py-1 rounded-full">
                                {{ s.category }}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-gray-600">₹{{ s.price }}</td>
                        <td class="px-4 py-3 text-right">
                            <a [routerLink]="['/services', s._id, 'edit']"
                                class="px-3 py-1.5 rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200 transition">
                                Edit
                            </a>
                            <button *ngIf="authService.isAdmin()" (click)="deleteService(s._id!)"
                                class="px-3 py-1.5 rounded-lg ml-3 bg-red-100 text-red-700 hover:bg-red-200 transition">
                                Delete
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="paginatedServices.length === 0">
                        <td colspan="4" class="px-4 py-6 text-center text-gray-400">No services yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="flex justify-end mt-6">

            <nav
                class="flex items-center bg-white rounded-xl shadow-sm border overflow-hidden border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">

                <button (click)="previousPage()" [disabled]="currentPage==1" class="px-4 py-2 hover:bg-slate-100">
                    ←
                </button>

                <button *ngFor="let page of pages" (click)="goToPage(page)" class="px-4 py-2 hover:bg-slate-100"
                    [ngClass]="page===currentPage ? 'bg-blue-600 text-white' : 'bg-white hover:bg-slate-200'">

                    {{page}}

                </button>

                <button (click)="nextPage()" [disabled]="currentPage==totalPages" class="px-4 py-2 hover:bg-slate-100">
                    →
                </button>

            </nav>

        </div>
    </div>
</div>
