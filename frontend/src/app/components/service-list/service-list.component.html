<div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold text-gray-800">Services</h2>
        <a routerLink="/services/new"
            class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition-colors">
            + Add Service
        </a>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex items-center gap-2 text-gray-500 text-sm py-4">
        <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span>Loading services...</span>
    </div>

    <div *ngIf="!loading" class="overflow-x-auto bg-white rounded-xl shadow border border-gray-100">
        <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left font-medium text-gray-600">Name</th>
                    <th class="px-4 py-3 text-left font-medium text-gray-600">Category</th>
                    <th class="px-4 py-3 text-left font-medium text-gray-600">Price</th>
                    <th class="px-4 py-3 text-right font-medium text-gray-600">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let s of paginatedServices" class="hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium text-gray-800">{{ s.name }}</td>
                    <td class="px-4 py-3">
                        <span
                            class="inline-block bg-blue-50 text-blue-700 text-xs font-medium px-2.5 py-1 rounded-full">
                            {{ s.category }}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-gray-600">₹{{ s.price }}</td>
                    <td class="px-4 py-3 text-right">
                        <a [routerLink]="['/services', s._id, 'edit']"
                            class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                            Edit
                        </a>
                        <button *ngIf="authService.isAdmin()" (click)="deleteService(s._id!)"
                            class="text-red-600 hover:text-red-800 text-sm font-medium">
                            Delete
                        </button>
                    </td>
                </tr>
                <tr *ngIf="paginatedServices.length === 0">
                    <td colspan="4" class="px-4 py-6 text-center text-gray-400">No services yet.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="flex justify-end mt-6">

        <nav class="inline-flex rounded-md shadow-sm">

            <button (click)="previousPage()" [disabled]="currentPage==1"
                class="px-4 py-2 border rounded-l-md bg-white hover:bg-gray-100 disabled:opacity-50">
                ←
            </button>

            <button *ngFor="let page of pages" (click)="goToPage(page)" class="px-4 py-2 border-t border-b"
                [ngClass]="page===currentPage ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-100'">

                {{page}}

            </button>

            <button (click)="nextPage()" [disabled]="currentPage==totalPages"
                class="px-4 py-2 border rounded-r-md bg-white hover:bg-gray-100 disabled:opacity-50">
                →
            </button>

        </nav>

    </div>
</div>
