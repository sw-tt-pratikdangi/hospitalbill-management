<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white p-8 rounded-xl shadow border border-gray-100">
        <h2 class="text-2xl font-semibold text-gray-800 mb-1">Forgot Password</h2>
        <p class="text-sm text-gray-500 mb-6">Enter your email and we'll send you a reset link.</p>

        <div *ngIf="submitted" class="bg-green-50 border border-green-200 rounded-lg px-4 py-3 text-sm text-green-800">
            If that email is registered, a reset link has been sent. Check your inbox.
        </div>

        <form *ngIf="!submitted" #f="ngForm" (ngSubmit)="onSubmit()" class="space-y-4" novalidate>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input [(ngModel)]="email" name="email" type="email" required email #emailField="ngModel"
                    class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    [class.border-red-400]="emailField.invalid && emailField.touched"
                    [class.border-gray-300]="!(emailField.invalid && emailField.touched)" />
                <p *ngIf="emailField.invalid && emailField.touched" class="text-xs text-red-600 mt-1">
                    Enter a valid email address.
                </p>
            </div>

            <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

            <button type="submit" [disabled]="f.invalid || submitting"
                class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm transition-colors">
                {{ submitting ? 'Sending...' : 'Send Reset Link' }}
            </button>
        </form>

        <p class="text-sm text-gray-500 text-center mt-6">
            <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Back to Login</a>
        </p>
    </div>
</div>
