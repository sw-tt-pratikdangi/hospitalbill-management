<!-- Navbar: only shown once logged in -->
<header *ngIf="isLoggedIn" class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">

    <div class="max-w-7xl mx-auto px-6">

        <div class="flex items-center justify-between h-16">

            <!-- Logo -->

            <div class="flex items-center gap-8">

                <a routerLink="/dashboard" class="flex items-center gap-3">

                    <div class="w-11 h-11 rounded-2xl
                   bg-gradient-to-r from-blue-600 to-indigo-600
                   text-white
                   flex items-center justify-center
                   shadow-md">

                        🏥

                    </div>

                    <div>

                        <h1 class="text-lg font-bold text-slate-900">
                            Hospital Billing
                        </h1>

                        <p class="text-xs text-slate-500">
                            Management System
                        </p>

                    </div>

                </a>

                <!-- Navigation -->

                <nav class="hidden md:flex items-center gap-2">

                    <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-700" class="px-4 py-2 rounded-xl
                   text-sm font-medium text-slate-600
                   hover:bg-slate-100
                   hover:text-slate-900
                   transition-all duration-200">

                        Dashboard

                    </a>

                    <a routerLink="/patients" routerLinkActive="bg-blue-50 text-blue-700" class="px-4 py-2 rounded-xl
                   text-sm font-medium text-slate-600
                   hover:bg-slate-100
                   hover:text-slate-900
                   transition-all duration-200">

                        Patients

                    </a>

                    <a routerLink="/services" routerLinkActive="bg-blue-50 text-blue-700" class="px-4 py-2 rounded-xl
                   text-sm font-medium text-slate-600
                   hover:bg-slate-100
                   hover:text-slate-900
                   transition-all duration-200">

                        Services

                    </a>

                    <a routerLink="/bills" routerLinkActive="bg-blue-50 text-blue-700" class="px-4 py-2 rounded-xl
                   text-sm font-medium text-slate-600
                   hover:bg-slate-100
                   hover:text-slate-900
                   transition-all duration-200">

                        Bills

                    </a>

                </nav>

            </div>

            <!-- User Section -->

            <div class="flex items-center gap-4">

                <div class="hidden sm:flex items-center gap-3">

                    <div class="w-10 h-10 rounded-full
                   bg-gradient-to-r from-indigo-500 to-purple-600
                   text-white text-sm font-semibold
                   flex items-center justify-center">

                        {{ userName?.charAt(0)?.toUpperCase() }}

                    </div>

                    <div>

                        <p class="text-sm font-medium text-slate-800">
                            {{ userName }}
                        </p>

                        <p class="text-xs text-slate-500">
                            Logged In
                        </p>

                    </div>

                </div>

                <button (click)="logout()" class="px-4 py-2 rounded-xl
                 bg-red-50 text-red-600
                 font-medium
                 hover:bg-red-100
                 transition">

                    Logout

                </button>

            </div>

        </div>

    </div>

</header>

<!-- Main Content -->
<main class="min-h-[calc(100vh-140px)] bg-slate-50">

    <router-outlet></router-outlet>

</main>

<!-- Footer -->
<footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <div class="flex flex-col gap-6 py-6
                    sm:flex-row sm:items-center sm:justify-between">

            <!-- Brand -->
            <div class="flex items-center gap-3">

                <!-- Logo -->
                <div class="flex h-10 w-10 shrink-0 items-center justify-center
                            rounded-xl
                            bg-gradient-to-br from-blue-600 to-indigo-600
                            text-lg text-white shadow-sm">
                    🏥
                </div>

                <!-- Brand Text -->
                <div>
                    <h3 class="text-sm font-semibold text-slate-800">
                        Hospital Billing System
                    </h3>

                    <p class="mt-0.5 text-xs text-slate-500">
                        © {{ currentYear }} All rights reserved.
                    </p>
                </div>

            </div>


            <!-- Footer Navigation -->
            <div class="flex flex-wrap items-center
                        justify-center gap-x-6 gap-y-3
                        text-sm">

                <a href="#" class="text-slate-500 transition-colors
                           hover:text-blue-600
                           focus:outline-none focus:text-blue-600">
                    Privacy Policy
                </a>

                <a href="#" class="text-slate-500 transition-colors
                           hover:text-blue-600
                           focus:outline-none focus:text-blue-600">
                    Terms of Service
                </a>

                <a href="#" class="text-slate-500 transition-colors
                           hover:text-blue-600
                           focus:outline-none focus:text-blue-600">
                    Support
                </a>

                <!-- Version -->
                <span class="inline-flex items-center gap-1.5
                           rounded-full
                           bg-emerald-50
                           px-2.5 py-1
                           text-xs font-medium
                           text-emerald-700
                           ring-1 ring-inset ring-emerald-600/20">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>

                    Version 1.0.0
                </span>

            </div>

        </div>

    </div>
</footer>
