<!-- Navbar: only shown once logged in -->
<header *ngIf="isLoggedIn" class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-16">

            <div class="flex items-center gap-8">
                <span class="text-lg font-semibold text-gray-800">
                    🏥 Hospital Billing
                </span>

                <div class="flex gap-1">
                    <a routerLink="/dashboard" routerLinkActive="bg-blue-50 text-blue-700"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
                        Dashboard
                    </a>

                    <a routerLink="/patients" routerLinkActive="bg-blue-50 text-blue-700"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
                        Patients
                    </a>

                    <a routerLink="/services" routerLinkActive="bg-blue-50 text-blue-700"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
                        Services
                    </a>

                    <a routerLink="/bills" routerLinkActive="bg-blue-50 text-blue-700"
                        class="px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
                        Bills
                    </a>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-500">
                    Hi, {{ userName }}
                </span>

                <button (click)="logout()"
                    class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
                    Logout
                </button>
            </div>

        </div>
    </div>
</header>

<!-- Main Content -->
<main class="min-h-[calc(100vh-200px)] bg-gray-50">
    <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer *ngIf="isLoggedIn" class="bg-white border-t border-gray-200 mt-10">
    <div class="max-w-6xl mx-auto px-4 py-5">

        <div class="flex flex-col md:flex-row items-center justify-between gap-3">

            <div class="text-sm text-gray-600">
                © {{currentYear}} Hospital Billing Management System.
                All rights reserved.
            </div>

            <div class="flex items-center gap-6 text-sm">

                <a href="#" class="text-gray-500 hover:text-blue-600 transition-colors">
                    Privacy Policy
                </a>

                <a href="#" class="text-gray-500 hover:text-blue-600 transition-colors">
                    Terms of Service
                </a>

                <span class="text-gray-400">
                    Version 1.0.0
                </span>

            </div>

        </div>

    </div>
</footer>
